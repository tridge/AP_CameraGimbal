# Raspberry Pi + IMX477 + CADDX gimbal defaults; install as /etc/ap_cameragimbal/camera.ini.
[general]
timezone = GMT
[mount]
orientation = upright
[uart]
# MAVLink arrives through the local MAVLink router (for example Rpanion-server).
protocol = none
[mavlink]
# 0 waits for a flight-controller heartbeat to adopt its ID.
system_id = 0
camera_component_id = 100
position_targeting = false
# Add a mavlink-router UDP client endpoint to 127.0.0.1:14570. Port 14550 is
# left free for the router's own GCS endpoint. The web interface sends its
# camera controls to the TCP port.
tcp_port = 14570
udp_port = 14570
[capture]
# Photo size: "video" copies a video frame (the main stream resolution) without
# interrupting streaming or recording. "2028x1520" (binned) and "4056x3040" (full sensor)
# switch the sensor mode, pausing video and recording for under a second.
resolution = video
[recording]
autorecord = false
# Not used on this target: recordings use the [stream.main] resolution below.
# 1920x1080 is the only value accepted here, so leave it as it is.
resolution = 1920x1080
[video]
# misb (default): .misb RTSP and .ts recordings; apcg: JSON SEI and MP4.
# Applies after restarting camera-app. MAVLink parameter: VIDEO_META_FMT.
telemetry = misb

[stream.main]
# Main stream and recording size: 1920x1080, 1280x720, 960x540, 854x480,
# 640x360, 426x240 or 320x180. Smaller sizes need less bandwidth.
resolution = 1920x1080
codec = h264
# optional extra RTSP path name for /video1
alias = ""
# H.264 bitrate in kbps (1000 to 20000) and frame rate (5 to 30). The CM4
# hardware encoder handles 1080p up to 30 fps. The bitrate applies
# immediately; the frame rate applies after a restart of the camera app.
bitrate_kbps = 4096
frame_rate = 30
[image]
brightness = 50
saturation = 50
contrast = 50
exposure_compensation = 0
iso = auto
shutter = auto
metering = average
white_balance = auto

# The host OS owns the Pi's network interfaces and addresses.
[network]
capture = false
# Complete URI the GCS uses for video stream 1, for example
# rtsp://10.0.0.5:8554/video1. Blank builds it from the Pi's own address, which
# is a guess when the Pi has several networks. The camera serves /video1 and
# any [stream.main] alias.
video1_uri = ""
# Gimbal link: a serial port such as /dev/ttyAMA0, or a network address such as
# udp://192.168.144.15:15002 or tcp://192.168.144.15:15002. Blank uses --uart,
# then CAMERA_APP_UART. Needs a camera-app restart.
uart_device_override = ""
