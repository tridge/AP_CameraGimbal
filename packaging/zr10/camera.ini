# ZR10 initial hardware-test defaults. Settings are preserved on the SD card.
[general]
timezone = GMT
[capture]
photo_scope = all
[mount]
# Mounting transforms need hardware validation; start with upright.
orientation = upright
[uart]
# Linux UART transport only; the external connector is assumed MCU-owned,
# like A8 and MT11. This does not select or disable its protocol.
protocol = none
[mavlink]
# Geographic ROI tracking; explicit angle/rate commands are unchanged.
tracking_method = rate
system_id = 0
position_targeting = true
tcp_port = 16001
udp_port = 16001
[thermal]
palette = white_hot
[recording]
autorecord = false
resolution = 2560x1440
[video]
# misb (default): .misb RTSP and .ts recordings; apcg: JSON SEI and MP4.
# Applies after restarting camera-app. MAVLink parameter: VIDEO_META_FMT.
telemetry = misb

[stream.main]
# 1280x720, 1920x1080 and 2560x1440. Three encoders share the hardware budget.
resolution = 1280x720
codec = h264
# extra RTSP path for the same stream; the vendor firmware serves main.264
alias = "main.264"
[stream.sub]
resolution = 1280x720
codec = h264
alias = ""
[image]
# Factory IQ retained; manual overrides are not yet implemented.
brightness = 50
saturation = 50
contrast = 50
exposure_compensation = 0
iso = auto
shutter = auto
metering = average
white_balance = auto

[support_proxy]
enabled = false
host = ""
mavlink_port = 10001
signing = false
signing_passphrase = ""
signing_link_id = 1
# Set session-assigned ports to enable video publishing; 0 disables.
video1_port = 0
video1_name = "video1"
video2_port = 0
video2_name = "video2"
publish_password = ""

# Address settings apply on camera-app restart. Blank primary leaves current addresses in place.
# An explicit primary replaces the interface's IPv4 addresses; IPv6 is unchanged.
[network]
interface = eth0
primary_address = ""
secondary_address = ""
gateway = ""
# Live packet capture, off by default; four 16 MiB PCAP files in DCIM/network.
capture = false
