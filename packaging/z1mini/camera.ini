# XFRobot Z1-Mini overlay defaults; preserved across updates in /opt/ap_cameragimbal.
[general]
timezone = GMT
[mount]
orientation = upright
[uart]
# External flight-controller UART pinout is not verified. MAVLink uses Ethernet.
protocol = none
[mavlink]
# 1 works on a bench; 0 waits for a flight-controller heartbeat to adopt its ID.
system_id = 0
camera_component_id = 100
position_targeting = false
tcp_port = 14550
udp_port = 14550
[recording]
autorecord = false
resolution = 1920x1080
[video]
# apcg (default) or misb: extra .misb RTSP endpoints and .ts recordings.
# Applies after restarting camera-app. MAVLink parameter: VIDEO_META_FMT.
telemetry = apcg

[stream.main]
resolution = 1920x1080
codec = h264
# optional extra RTSP path names for /video1 and /video2
alias = ""
[stream.sub]
# First overlay duplicates the main stream; no second encoder is allocated.
resolution = 1920x1080
codec = h264
alias = ""

# Address settings apply on camera-app restart. Blank primary leaves current addresses in place.
# An explicit primary replaces the interface's IPv4 addresses; IPv6 is unchanged.
[network]
interface = eth0
primary_address = ""
secondary_address = ""
gateway = ""
# Live packet capture, off by default; four 16 MiB PCAP files in DCIM/network.
capture = false
