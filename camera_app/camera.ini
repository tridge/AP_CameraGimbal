# camera-app configuration
#
# This file belongs to the ArduPilot camera app. It intentionally does not
# share the vendor application's /app/config.ini format.

[general]
# Built-in IANA name (see timezones/zones.txt). GMT is UTC+0.
timezone = GMT

[capture]
# thermal: save only the radiometric thermal plane for SIYI photo commands
# all: save wide (C), zoom (Z), thermal display (I) JPEGs and thermal raw data
photo_scope = all

[mount]
# auto follows the mounting direction reported by the gimbal controller.
# upright and inverted force a mounting direction.
orientation = auto

[uart]
# Linux UART transport only (none, siyi or mavlink).
# The MT11 external connector is handled by the gimbal MCU; this setting cannot
# select its protocol or disable its input. No Linux UART is used by default.
protocol = none

[mavlink]
# 0 adopts the first flight controller heartbeat system ID; 1..255 fixes it.
system_id = 0
# Camera component: 100 (CAMERA) through 105 (CAMERA6). Restart to apply.
camera_component_id = 100
# MAVLink 2 camera and gimbal-device services listen on both transports.
# TCP and UDP may use the same numeric port. Set either one to 0 to disable it.
# Advertise and handle geographic ROI targets in the camera when true.
position_targeting = true
# angle: absolute positions; rate: predicted motion plus pointing correction.
tracking_method = angle
tcp_port = 14550
udp_port = 14550

[thermal]
# Lossless raw thermal rates. Recording follows the video recording policy.
stream_fps = 5
# 0 disables raw recording; 1..25 selects its rate independently of streaming.
record_fps = 5
# white_hot, sepia, ironbow, rainbow, night, aurora, red_hot, jungle,
# medical, black_hot or glory_hot
palette = white_hot

[recording]
# false: manual, true: start at app startup, while_armed: follow MAVLink arming
autorecord = false
resolution = 3840x2160

[video]
# misb (default): .misb RTSP and .ts recordings; apcg: JSON SEI and MP4.
# Applies after restarting camera-app. MAVLink parameter: VIDEO_META_FMT.
telemetry = misb

[stream.main]
# rtsp://CAMERA:8554/video1
resolution = 1920x1080
codec = h264
# extra RTSP path for the same stream; the vendor firmware serves main.264
alias = "main.264"

[stream.sub]
# rtsp://CAMERA:8554/video2
resolution = 1280x720
codec = h264
alias = ""

[image]
# Visible-camera controls are applied to both RGB sensors.
brightness = 50
saturation = 50
contrast = 50
# Tenths of an EV, from -10 (-1 EV) through 10 (+1 EV).
exposure_compensation = 0
iso = auto
shutter = auto
metering = average
white_balance = auto

# Optional ArduPilot SupportProxy relay; settings apply on app restart.
[support_proxy]
enabled = false
host = ""
mavlink_port = 10001
signing = false
signing_passphrase = ""
signing_link_id = 1
# Set session-assigned ports to enable video publishing; 0 disables.
video1_port = 0
video1_name = "video1"
video2_port = 0
# Thermal-capable cameras: lossless FFV1/Matroska on SupportProxy slot 3.
video3_port = 0
video3_name = Raw Thermal (16-bit)
video2_name = "video2"
publish_password = ""

[logging]
# BIN logs are always written while armed. Enable for bench diagnostics.
disarmed=false

# Address settings apply on camera-app restart. Blank primary leaves current addresses in place.
# An explicit primary replaces the interface's IPv4 addresses; IPv6 is unchanged.
[network]
interface = eth0
primary_address = ""
secondary_address = ""
gateway = ""
# Live packet capture, off by default; four 16 MiB PCAP files in DCIM/network.
capture = false

[overlay]
# Applied immediately to live video.
cross=false
# RGB only, when a thermal lens is present. Nominal co-aligned lens geometry.
thermal_fov=false
# Burn enabled overlays into recordings too (MT11/A8/ZR10). Default: clean recordings.
recording=false
