name: Camera firmware
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camera-firmware-${{ github.ref }}
  cancel-in-progress: true
env:
  MAKEFLAGS: -j8

jobs:
  legacy-python:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10.11', '3.10.13', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test extraction with and without the PEP 706 backport
        run: |
          python tests/test_safe_tar.py
          sudo "$(command -v python)" tests/test_safe_tar.py

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Test legacy Python tar extraction safety
        run: python3 tests/test_safe_tar.py
      - name: Install compilers, SDKs and build tools
        run: python3 tools/install_build_environment.py
      - name: Build all camera release packages
        run: make -j8 release
      - name: Build and test ZT30 bring-up tools
        run: make zt30_abi_probe zt30_vendor_exec zt30_uart_trace zt30_control_probe zt30_owned_sys_probe zt30_kmsg_capture zt30_ioctl_trace zt30_usb_trace zt30_usb_header_trace zt30_usb_setup_trace zt30_usb_iso_private_probe zt30_thermal_pixels_private_probe zt30_buffer_abi_private_probe zt30_input_buffer_private_probe zt30_input_metadata_private_probe build/zt30/input-metadata-probe zt30_usb_iso_probe zt30_usb_memory_probe zt30_usb_control_probe zt30_self_read_probe zt30_ioctl_payload_trace zt30_payload_probe zt30_abi_probe-test zt30_ram_watchdog-test zt30_uart_trace-test zt30_control_probe-test zt30_focus-test zt30_owned_sys_probe-test zt30_kmsg_capture-test zt30_ioctl_trace-test zt30_usb_trace-test zt30_usb_header_trace-test zt30_usb_setup_trace-test zt30_usb_iso-test zt30_thermal_pixels-test zt30_buffer_abi-test zt30_input_buffer-test zt30_input_metadata-test zt30_usb_iso_probe-test zt30_usb_memory-test zt30_usb_control-test zt30_self_read_probe-test zt30_payload_probe-test zt30_ioctl_payload_trace-test zt30_media_abi-test zt30_rgb_owner-test zt30_rgb_sdk-test zt30_encoder_owner-test zt30_pts_clock-test zt30_vui_sdk-test zt30_media_backend-test zt30_ram_frontend-test
      - name: Test native ZT30 controls, media and packaging
        run: make zt30_unigcs_encoder-test zt30_image-test zt30_recording-test zt30_overlay-test zt30_thermal_controls-test zt30_native_control-test zt30_camera_information-test zt30_jpeg_owner-test zt30_input_mapping-test zt30_thermal_start_budget-test zt30_dev_package-test
      - name: Test native ZT30 web parameters
        run: make -C web zt30-parameters-test zt30-process-test
      - name: Test native ZT30 thermal metadata
        run: make -C camera_app zt30-thermal-metadata-test
      - name: Build and test ZT30 application slots and bundle failures
        run: make build/zt30/zt30-slot zt30_slots-test zt30_bundle-test zt30_update-test
      - name: Compile and link both native ZT30 applications
        run: make zt30_ram_camera_build zt30_dev_camera_build
      - name: Check packaging and UUID helpers
        run: make release-test platform-test camera-definition-test targets-test survey-runtime-test
      - name: Test native Z1-Mini overlay failures and request ordering
        run: make z1mini-overlay-test
      - name: Test Z1-Mini web firmware updates
        run: python3 web/tests/test_z1mini_upgrade.py
      - uses: actions/upload-artifact@v4
        with:
          name: AP-CameraGimbal-firmware
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AP-CameraGimbal-camera-definitions
          path: build/camera-definitions/*.xml
          if-no-files-found: error
      - name: Test Z1-Mini offline integration and separate 4K recording
        run: |
          build/environment/bin/python3 tests/test_z1mini.py
          build/environment/bin/python3 tests/test_z1mini_4k.py
          build/environment/bin/python3 tests/test_z1mini_4k.py --orientation inverted

  exposure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SITL test dependencies
        run: |
          sudo apt-get update
          # PyQt wheels still require native GL/EGL libraries when using offscreen.
          sudo apt-get install -y build-essential ffmpeg python3-venv iproute2 tcpdump libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libxcb-cursor0
          python3 -m venv build/terrain-venv
          build/terrain-venv/bin/pip install pymavlink numpy opencv-python-headless av pexpect defusedxml PyQt6
          # The live-control tests use MAVProxy's camera definition parser.
          build/terrain-venv/bin/pip install --no-deps 'MAVProxy @ git+https://github.com/ArduPilot/MAVProxy.git@13b1fb1cf6f594a026349e369576a8d11ce1d5b4'
          echo "$PWD/build/terrain-venv/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned build sources
        run: make dependencies
      - name: Build all five simulators concurrently
        run: make -j8 sitl a8_sitl zr10_sitl z1mini_sitl zt30_sitl
      - name: Test ZT30 module zoom, lens scenes, FOV and protocol contracts
        run: make zt30_sitl-test
      - name: Test RTSP buffer ownership and TCP socket options
        run: make -C camera_app xop-test
      - name: Test both telemetry formats on every simulator
        run: |
          make -C camera_app tests/test_misb
          camera_app/tests/test_misb
          make -C camera_app rtsp-demand-test
          make sitl-misb-telemetry-test
      - name: Test C++ web buffer ownership and escaping
        run: |
          make -C web tests/test_string_buffer
          web/tests/test_string_buffer
      - name: Test configuration migration, IP addresses, routes and rollback
        run: |
          make -C camera_app timezone-test tests/test_config host
          camera_app/tests/test_config camera_app/camera.ini
          python3 sitl/test_network.py --sudo
          python3 camera_app/tests/test_network_status.py camera_app/tests/camera-app-host
          make -C web network-status-test
      - name: Test survey geometry, capture lifecycle, metadata history and terrain cache
        run: |
          make -C camera_app survey-test survey-lifecycle-test metadata-history-test terrain-test
          python3 sitl/test_survey_controls.py
      - name: Test system health BIN logging
        run: make -C camera_app system-stats-test
      - name: Test Raspberry Pi image controls, CADDX gimbal and JPEG stills, and build against libcamera 0.2
        run: |
          make -C camera_app rpi_libcam_caddx-test
          sudo apt-get install -y libcamera-dev libjpeg-dev pkg-config
          make -C camera_app rpi_jpeg-test
          make -j8 rpi_libcam_caddx
      - name: Test MAVLink control BIN logging and sender identities
        run: make -C camera_app mavlink-binlog-test
      - name: Test SIYI and XFRobot packet BIN logging on all camera targets
        run: make -C camera_app vendor-binlog-test
      - name: Test thermal conversion and MAVLink telemetry
        run: |
          make -C camera_app tests/test_thermal thermal-mavlink-test
          camera_app/tests/test_thermal
      - name: Test ISP decoding, native IPC and background polling
        run: make -C camera_app exposure-test manual-control-test
      - name: Test image tracker lifetime, geometry and MT11 overlay transitions
        run: make -C camera_app image-tracking-test media-overlay-test
      - name: Test MCU UART MAVLink and delegated SIYI camera commands
        run: |
          make -C camera_app mcu-uart-test
          python3 camera_app/tests/test_a8_delegated.py camera_app/tests/camera-app-a8-host
      - name: Test exclusive manual gimbal control and restart
        run: |
          make -C camera_app host
          python3 camera_app/tests/test_manual_mavlink.py camera_app/tests/camera-app-host sitl/gimbal_sim.py
      - name: Test all six camera and gimbal component pairs
        run: make -C camera_app mavlink-components-test
      - name: Test exposure BIN logs and live controls on all four simulated cameras
        run: |
          python3 tests/test_overlay.py
          make sitl-image-controls-test
      - name: Test quantised MT11 optical zoom and continuous rate control
        run: |
          make camera-definitions
          python3 sitl/test_camera_definition.py --targets mt11 --zoom-only
      - name: Test UniGCS discovery and private SIYI camera control
        run: |
          make -C camera_app sitl tests/test_protocol
          camera_app/tests/test_protocol
          make -C camera_app unigcs-time-test
          python3 sitl/test_unigcs.py build/sitl/camera-app --video-codec h264
          python3 sitl/test_unigcs.py build/sitl/camera-app --video-codec h265
          make -C camera_app sitl CAMERA_BACKEND=a8 SITL_OBJDIR=build/a8-sitl SITL_TARGET=../build/a8-sitl/camera-app
          make -C camera_app sitl CAMERA_BACKEND=zr10 SITL_OBJDIR=build/zr10-sitl SITL_TARGET=../build/zr10-sitl/camera-app
          python3 sitl/test_unigcs.py build/a8-sitl/camera-app --backend a8 --video-codec h265
          python3 sitl/test_unigcs.py build/zr10-sitl/camera-app --backend zr10 --video-codec h265
          sudo unshare -n "$(command -v python3)" sitl/test_unigcs.py build/a8-sitl/camera-app --backend a8 --late-interface
      - name: Test network capture and A8 web download
        run: |
          make -C camera_app network-capture-test
          make -C web CAMERA_BACKEND=a8 portable-sitl SITL_BIN_ROOT=../build/a8-sitl
          sudo unshare -n "$(command -v python3)" sitl/test_network_capture.py
      - name: Test bounded video fixture catch-up
        run: python3 sitl/test_video_fixture.py
      - name: Check headless Qt runtime
        run: QT_QPA_PLATFORM=offscreen python3 -c 'from PyQt6.QtWidgets import QApplication; app = QApplication([])'
      - name: Test multiple simulator launcher lifecycle
        run: QT_QPA_PLATFORM=offscreen python3 sitl/test_launch.py
      - name: Test four concurrent simulator stacks
        run: QT_QPA_PLATFORM=offscreen python3 sitl/test_launch_multi.py
