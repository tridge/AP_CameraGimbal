# ZR10 SITL defaults. Saved settings are preserved between launches.
[general]
timezone = GMT
[capture]
photo_scope = all
[mount]
# The simulator reports the physical orientation selected in the launcher.
orientation = auto
[uart]
protocol = none
[mavlink]
system_id = 0
camera_component_id = 100
position_targeting = true
tcp_port = 14550
udp_port = 14550
[thermal]
palette = white_hot
[recording]
autorecord = false
resolution = 2560x1440
[video]
# misb (default): .misb RTSP and .ts recordings; apcg: JSON SEI and MP4.
# Applies after restarting camera-app. MAVLink parameter: VIDEO_META_FMT.
telemetry = misb

[stream.main]
# 1280x720, 1920x1080 and 2560x1440. Three encoders share the hardware budget.
resolution = 1280x720
codec = h264
[stream.sub]
resolution = 1280x720
codec = h264
[image]
# Factory IQ retained; manual overrides are not yet implemented.
brightness = 50
saturation = 50
contrast = 50
exposure_compensation = 0
iso = auto
shutter = auto
metering = average
white_balance = auto

[support_proxy]
enabled = false
host = ""
mavlink_port = 10001
signing = false
signing_passphrase = ""
signing_link_id = 1
# Set session-assigned ports to enable video publishing; 0 disables.
video1_port = 0
video1_name = "video1"
video2_port = 0
video2_name = "video2"
publish_password = ""
[network]
interface = "eth0"
primary_address = ""
secondary_address = ""
gateway = ""
